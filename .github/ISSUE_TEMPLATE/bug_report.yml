name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command or MCP tool call and the full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: pdf
    attributes:
      label: About the PDF
      description: Output of `pdfedit info file.pdf`. Only attach the PDF itself if it has no private content.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, pdfeditor 0.1.0"
    validations:
      required: true
